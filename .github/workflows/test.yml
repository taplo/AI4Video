name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install -r requirements-dev.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-test-secret-key' }}
          DEBUG: "true"
        run: uv run python manage.py makemigrations --check --dry-run app

      - name: Lint with flake8
        run: |
          uv run flake8 app/ tests/ --max-line-length=120 --count --show-source --statistics || true

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "true"
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=29

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
